      z-index: 0;

    .profile-frame img {

    .social-icons {

<script>
// Background small stars
function createBgStars() {
  const bg = document.getElementById('bg-stars');
  for(let i = 0; i < 250; i++) {
    const star = document.createElement('div');
    star.className = 'bg-star';
    const size = Math.random() * 3.2 + 0.7;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 5 + 's';
    bg.appendChild(star);
  }
}

// Shooting stars
function createShootingStar() {
  const container = document.getElementById('stars');
  const star = document.createElement('div');
  star.className = 'star';

  const size = Math.random() * 4.5 + 2;
  star.style.width = size + 'px';
  star.style.height = size + 'px';

  const duration = Math.random() * 8 + 5;
  star.style.animationDuration = duration + 's';

  const xStart = Math.random() * 100;
  const drift = (Math.random() - 0.5) * 600;

  star.style.setProperty('--x-start', xStart + 'vw');
  star.style.setProperty('--drift', drift + 'px');
  star.style.left = xStart + 'vw';

  container.appendChild(star);

  setTimeout(() => star.remove(), (duration + 1) * 1000);
}

createBgStars();
setInterval(createShootingStar, 650);

for(let i = 0; i < 18; i++) {
  setTimeout(createShootingStar, i * 300);
}
</script>
