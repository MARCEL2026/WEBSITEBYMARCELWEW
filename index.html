<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #f4f4f4;
        }
        h1 { 
            text-align: center; 
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 450px;
            font-family: monospace;
            font-size: 15px;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .controls {
            text-align: center;
            margin: 15px 0;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            margin: 6px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>Editor Website</h1>
    
    <div class="controls">
        <button onclick="kirimKePreview()">🚀 Kirim ke Preview</button>
        <button onclick="refreshPreview()">🔄 Refresh Preview</button>
        <button onclick="window.location.reload()">🔃 Refresh Halaman Ini</button>
    </div>

    <textarea id="code" placeholder="Masukkan codingan HTML kamu di sini...">
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>
    <style>
        body { 
            font-family: Arial; 
            text-align: center; 
            padding: 50px; 
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
        }
        h1 { font-size: 3em; }
    </style>
</head>
<body>
    <h1>Selamat Datang!</h1>
    <p>Ini adalah contoh website yang akan muncul di preview.</p>
</body>
</html>
    </textarea>

    <script>
        // Kirim ke Preview
        function kirimKePreview() {
            const code = document.getElementById('code').value;
            const channel = new BroadcastChannel('website-preview');
            channel.postMessage(code);
            alert("✅ Codingan berhasil dikirim ke Preview!");
        }

        // Refresh Preview
        function refreshPreview() {
            const channel = new BroadcastChannel('website-preview');
            channel.postMessage("REFRESH");
            alert("🔄 Perintah refresh dikirim ke Preview!");
        }
    </script>
</body>
</html>
