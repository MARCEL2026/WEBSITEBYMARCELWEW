<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WELLCOME TO WEBSITE ALL GAMES BY MARCEL</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      overflow-y: auto;
      background: radial-gradient(ellipse at bottom, #1a0000 0%, #000814 100%);
      color: #ffeeee;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
    }
    .stars, .bg-stars { position: fixed; inset:0; pointer-events:none; z-index:0; }
    .container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px 40px;
      text-align: center;
    }
    header {
      position: fixed;
      top: 0; left:0; right:0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      padding: 15px 20px;
      z-index: 100;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .hamburger {
      font-size: 2rem;
      cursor: pointer;
      color: #ff6b6b;
    }
    .menu {
      display: none;
      position: absolute;
      top: 60px; right: 20px;
      background: #111;
      border: 2px solid #ff4444;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 0 20px rgba(255,107,107,0.5);
    }
    .menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 10px;
      border-bottom: 1px solid #444;
    }
    .menu a:last-child { border-bottom: none; }
    .menu a:hover { background: #222; }
    .profile-frame, h1, .subtitle { margin: 1rem 0; }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #111;
      padding: 30px;
      border-radius: 15px;
      width: 90%; max-width: 400px;
      border: 2px solid #ff6b6b;
    }
    input { width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ff4444; background:#222; color:white; }
    button { padding:10px 20px; background:#ff4444; border:none; border-radius:8px; color:white; cursor:pointer; margin:10px 5px; }
    button:hover { background:#ff6b6b; }
    /* Profil */
    #profil-section { display:none; }
    #profil-section img { width:150px; height:150px; border-radius:50%; object-fit:cover; border:4px solid #ff6b6b; }
    #edit-form { display:none; margin-top:20px; }
    /* Album */
    #album-section {
      margin-top: 40px;
      width: 100%; max-width: 900px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .gallery-item {
      position: relative;
      border: 2px solid #444;
      border-radius: 10px;
      overflow: hidden;
    }
    .gallery-item img, .gallery-item video {
      width: 100%; height: auto; display: block;
    }
    .delete-btn {
      position: absolute;
      top: 5px; right: 5px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px; height: 30px;
      cursor: pointer;
      display: none;
    }
    #upload-area { margin: 20px 0; display:none; }
    #creator-note { color: #ff9999; font-size: 0.9rem; margin: 10px 0; }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="bg-stars" id="bg-stars"></div>

<header>
  <div class="hamburger" id="hamburger">≡</div>
  <div class="menu" id="menu">
    <a href="#" id="login-link">Login</a>
  </div>
</header>

<div class="container">
  <div class="profile-frame">
    <img src="https://w0.peakpx.com/wallpaper/682/669/HD-wallpaper-flame-in-hand-trick-anonymous-flame-anonymus-artist-artwork-digital-art.jpg" alt="Marcel Profile">
  </div>

  <h1>MARCEL</h1>
  <div class="subtitle">WELLCOME TO WEBSITE ALL GAMES BY MARCEL</div>

  <!-- Social & Komunitas (tetap) -->
  <div class="social-icons">
    <!-- ... (sama seperti sebelumnya, copy dari versi lama kalau perlu) ... -->
  </div>

  <div class="community-section">
    <!-- ... (tombol komunitas sama seperti sebelumnya) ... -->
  </div>

  <!-- Profil Section (hidden awal) -->
  <div id="profil-section">
    <h2>Profil Kamu</h2>
    <img id="profil-img" src="https://via.placeholder.com/150?text=Profil" alt="Profil Kamu">
    <p><strong>Nama:</strong> <span id="profil-nama">a cake dulu</span></p>
    <p><strong>ID:</strong> <span id="profil-id">player#0000000</span></p>
    <button id="edit-btn">EDIT</button>

    <div id="edit-form">
      <h3>Edit Profil</h3>
      <input type="text" id="edit-nama" placeholder="Nama baru">
      <input type="file" id="edit-foto" accept="image/*">
      <img id="preview-foto" style="max-width:150px; display:none; margin:10px auto; border-radius:50%;">
      <button id="save-edit">Simpan Perubahan</button>
      <button id="cancel-edit">Batal</button>
    </div>
  </div>

  <!-- Album Section -->
  <div id="album-section">
    <h2>ALBUM WEBSITE ALL GAMES BY MARCEL</h2>
    <div id="creator-note">Hanya creator (MARCELNEW2026@gamil.com) yang bisa upload & delete</div>
    <div id="upload-area">
      <input type="file" id="upload-file" accept="image/*,video/*">
      <button id="upload-btn">Upload Foto/Video</button>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

  <!-- Modal Login -->
  <div class="modal" id="login-modal">
    <div class="modal-content">
      <h2>Masuk</h2>
      <input type="email" id="login-email" placeholder="MASUKAN EMAIL ANDA">
      <input type="password" id="login-password" placeholder="MASUKAN PASSWORD ANDA">
      <button id="btn-login">Masuk</button>
      <p>Anda belum memiliki akun? <a href="#" id="to-register">DAFTAR</a></p>
      <button id="close-login">Tutup</button>
    </div>
  </div>

  <!-- Modal Register -->
  <div class="modal" id="register-modal">
    <div class="modal-content">
      <h2>Daftar</h2>
      <input type="text" id="reg-nama" placeholder="NAMA ANDA">
      <input type="text" id="reg-game" placeholder="GAME ANDA">
      <input type="email" id="reg-email" placeholder="EMAIL KW ANDA">
      <input type="password" id="reg-password" placeholder="PASSWORD KW ANDA">
      <button id="btn-register">Daftar</button>
      <button id="close-register">Tutup</button>
    </div>
  </div>
</div>

<script>
// --- Bintang jatuh (sama seperti sebelumnya) ---
function createBgStars() { /* ... copy dari versi lama ... */ }
function createShootingStar() { /* ... copy ... */ }
createBgStars();
setInterval(createShootingStar, 650);
for(let i=0; i<18; i++) setTimeout(createShootingStar, i*300);

// --- Hamburger Menu ---
const hamburger = document.getElementById('hamburger');
const menu = document.getElementById('menu');
hamburger.addEventListener('click', () => {
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
});

// --- Login / Register Modal ---
const loginModal = document.getElementById('login-modal');
const registerModal = document.getElementById('register-modal');
const loginLink = document.getElementById('login-link');
loginLink.addEventListener('click', (e) => { e.preventDefault(); loginModal.style.display = 'flex'; });
document.getElementById('close-login').onclick = () => loginModal.style.display = 'none';
document.getElementById('to-register').onclick = (e) => {
  e.preventDefault();
  loginModal.style.display = 'none';
  registerModal.style.display = 'flex';
};
document.getElementById('close-register').onclick = () => registerModal.style.display = 'none';

// --- Cek sudah login ---
const creatorEmail = "MARCELNEW2026@gamil.com";
const creatorPass = "marcel2026new#";
let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

function updateUI() {
  if (currentUser) {
    document.getElementById('login-link').textContent = "Profil";
    document.getElementById('profil-section').style.display = 'block';
    document.getElementById('profil-nama').textContent = currentUser.nama || "a cake dulu";
    document.getElementById('profil-id').textContent = currentUser.id || "player#0000000";
    if (currentUser.foto) document.getElementById('profil-img').src = currentUser.foto;
    document.getElementById('upload-area').style.display = (currentUser.email === creatorEmail) ? 'block' : 'none';
    loadAlbum();
  } else {
    document.getElementById('profil-section').style.display = 'none';
    document.getElementById('upload-area').style.display = 'none';
  }
}

// --- Login ---
document.getElementById('btn-login').onclick = () => {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value.trim();
  const users = JSON.parse(localStorage.getItem('users')) || [];
  const user = users.find(u => u.email === email && u.password === pass);
  if (user) {
    currentUser = user;
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    updateUI();
    loginModal.style.display = 'none';
    alert("Login berhasil!");
  } else if (email === creatorEmail && pass === creatorPass) {
    currentUser = { email: creatorEmail, nama: "Marcel Creator", id: "creator#0000000" };
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    updateUI();
    loginModal.style.display = 'none';
    alert("Selamat datang Creator!");
  } else {
    alert("Email atau password salah!");
  }
};

// --- Register ---
document.getElementById('btn-register').onclick = () => {
  const nama = document.getElementById('reg-nama').value.trim() || "player#" + Math.floor(Math.random()*10000);
  const game = document.getElementById('reg-game').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-password').value.trim();
  if (!email || !pass) return alert("Email & password wajib!");
  let users = JSON.parse(localStorage.getItem('users')) || [];
  if (users.find(u => u.email === email)) return alert("Email sudah terdaftar!");
  const newUser = { nama, game, email, password: pass, id: "player#" + Math.floor(100000 + Math.random()*900000) };
  users.push(newUser);
  localStorage.setItem('users', JSON.stringify(users));
  alert("Daftar berhasil! Silakan login.");
  registerModal.style.display = 'none';
  loginModal.style.display = 'flex';
};

// --- Edit Profil ---
document.getElementById('edit-btn').onclick = () => {
  document.getElementById('edit-form').style.display = 'block';
  document.getElementById('edit-nama').value = currentUser.nama || "";
};
document.getElementById('cancel-edit').onclick = () => document.getElementById('edit-form').style.display = 'none';
document.getElementById('edit-foto').onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('preview-foto').src = ev.target.result;
      document.getElementById('preview-foto').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
};
document.getElementById('save-edit').onclick = () => {
  const newNama = document.getElementById('edit-nama').value.trim() || currentUser.nama;
  const file = document.getElementById('edit-foto').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentUser.foto = ev.target.result;
      currentUser.nama = newNama;
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      updateUI();
      document.getElementById('edit-form').style.display = 'none';
    };
    reader.readAsDataURL(file);
  } else {
    currentUser.nama = newNama;
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    updateUI();
    document.getElementById('edit-form').style.display = 'none';
  }
};

// --- Album Upload & Gallery ---
function loadAlbum() {
  const album = JSON.parse(localStorage.getItem('album')) || [];
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  album.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    if (item.type.startsWith('image')) {
      const img = document.createElement('img');
      img.src = item.data;
      div.appendChild(img);
    } else if (item.type.startsWith('video')) {
      const vid = document.createElement('video');
      vid.src = item.data;
      vid.controls = true;
      div.appendChild(vid);
    }
    if (currentUser && currentUser.email === creatorEmail) {
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'X';
      delBtn.onclick = () => {
        album.splice(index, 1);
        localStorage.setItem('album', JSON.stringify(album));
        loadAlbum();
      };
      div.appendChild(delBtn);
    }
    gallery.appendChild(div);
  });
}

document.getElementById('upload-btn').onclick = () => {
  const fileInput = document.getElementById('upload-file');
  const file = fileInput.files[0];
  if (!file) return alert("Pilih file dulu!");
  const reader = new FileReader();
  reader.onload = (e) => {
    let album = JSON.parse(localStorage.getItem('album')) || [];
    album.push({ type: file.type, data: e.target.result });
    localStorage.setItem('album', JSON.stringify(album));
    loadAlbum();
    fileInput.value = '';
    alert("Upload berhasil!");
  };
  reader.readAsDataURL(file);
};

// Init
updateUI();
</script>

</body>
</html>
