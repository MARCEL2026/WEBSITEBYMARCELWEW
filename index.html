<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Website & Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #f4f4f4;
        }
        h1 { 
            text-align: center; 
            margin-bottom: 25px;
            color: #333;
        }
        .file-section {
            margin-bottom: 35px;
            border: 2px solid #bbb;
            border-radius: 12px;
            background: white;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .file-header {
            background: linear-gradient(to right, #0066ff, #3388ff);
            color: white;
            padding: 12px 18px;
            border-radius: 10px 10px 0 0;
            font-weight: bold;
            font-size: 18px;
            margin: -15px -15px 15px -15px;
        }
        textarea {
            width: 100%;
            height: 320px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            padding: 14px;
            border: 1px solid #999;
            border-radius: 8px;
            box-sizing: border-box;
            line-height: 1.5;
        }
        .controls {
            text-align: center;
            margin: 30px 0;
        }
        button {
            padding: 14px 32px;
            font-size: 17px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #0066ff;
            color: white;
        }
        button:hover {
            background: #0055dd;
        }
        .note {
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Editor Website & Game</h1>

    <!-- index.html -->
    <div class="file-section">
        <div class="file-header">index.html (Halaman Utama)</div>
        <textarea id="index-html" placeholder="Kode untuk index.html"></textarea>
    </div>

    <!-- lobby.html -->
    <div class="file-section">
        <div class="file-header">lobby.html (Lobby / Menu)</div>
        <textarea id="lobby-html" placeholder="Kode untuk lobby.html"></textarea>
    </div>

    <!-- game.html -->
    <div class="file-section">
        <div class="file-header">game.html (Halaman Game)</div>
        <textarea id="game-html" placeholder="Kode untuk game.html"></textarea>
    </div>

    <div class="controls">
        <button onclick="kirimSemuaKePreview()">🚀 Kirim ke Preview</button>
        <button onclick="refreshPreview()">🔄 Refresh Preview</button>
        <button onclick="window.location.reload()">🔃 Refresh Editor</button>
    </div>

    <div class="note">
        Tulis kode di masing-masing halaman. Tombol "Kirim ke Preview" akan menggabungkan semuanya menjadi satu website.
    </div>

    <script>
        // Load kode dari localStorage
        function loadCodes() {
            document.getElementById('index-html').value = localStorage.getItem('index_html') || 
`<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body { 
            margin: 0; 
            background: linear-gradient(#0f0c29, #302b63, #24243e);

</head>
<body>
    <h1>Selamat Datang di Game</h1>
    <button onclick="window.location.href='lobby.html'">Masuk ke Lobby</button>

            document.getElementById('lobby-html').value = localStorage.getItem('lobby_html') || 
`<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
    <style>
        body { 
            margin: 0; 
            background: #1a1a2e; 
            color: white; 
            text-align: center; 
            padding: 80px 20px;
            font-family: Arial;
        }
        .room { 
            background: #16213e; 
            padding: 40px; 
            margin: 30px auto; 
            max-width: 600px; 
            border-radius: 20px;
        }
        button {
            padding: 12px 30px;

            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Lobby Game</h1>
    <div class="room">
        <h2>Pilih Room</h2>
        <button onclick="window.location.href='game.html'">Mulai Bermain</button>
    </div>

            document.getElementById('game-html').value = localStorage.getItem('game_html') || 
`<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body { margin:0; background:#000; overflow:hidden; }
        canvas { display:block; margin:40px auto; border: 5px solid #0ff; }
        button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <button onclick="window.location.href='lobby.html'">Kembali ke Lobby</button>
    <canvas id="game" width="800" height="500"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let x = 350, y = 200, speed = 7;

        function gameLoop() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(x, y, 80, 80);

            x += speed;
            if (x > canvas.width - 80 || x < 0) speed *= -1;

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    <\/script>
</body>
</html>`;
        }

        // Simpan kode
        function saveCodes() {
            localStorage.setItem('index_html', document.getElementById('index-html').value);
            localStorage.setItem('lobby_html', document.getElementById('lobby-html').value);
            localStorage.setItem('game_html', document.getElementById('game-html').value);
        }

        // Fungsi utama: Gabungkan semua menjadi satu file HTML dan kirim ke Preview
        function kirimSemuaKePreview() {
            saveCodes();

            const indexCode = document.getElementById('index-html').value;
            const lobbyCode = document.getElementById('lobby-html').value;
            const gameCode = document.getElementById('game-html').value;

            // Gabungkan menjadi satu HTML lengkap dengan navigasi
            const combinedHTML = `
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Multi Halaman</title>
    <style>
        body { margin:0; font-family: Arial, sans-serif; }
        .page { display: none; min-height: 100vh; }
        .active { display: block; }
    </style>
</head>
<body>

    <!-- Index Page -->
    <div id="index-page" class="page active">
        ${indexCode.replace(/<html[^>]*>|<head[^>]*>|<body[^>]*>|<\/html>|<\/head>|<\/body>/gi, '')}
    </div>

    <!-- Lobby Page -->
    <div id="lobby-page" class="page">
        ${lobbyCode.replace(/<html[^>]*>|<head[^>]*>|<body[^>]*>|<\/html>|<\/head>|<\/body>/gi, '')}
    </div>

    <!-- Game Page -->
    <div id="game-page" class="page">
        ${gameCode.replace(/<html[^>]*>|<head[^>]*>|<body[^>]*>|<\/html>|<\/head>|<\/body>/gi, '')}
    </div>

    <script>
        // Navigasi sederhana antar halaman
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    <\/script>
</body>
</html>`;

            const channel = new BroadcastChannel('website-preview');
            channel.postMessage(combinedHTML);
            
            alert("✅ Semua halaman telah digabungkan dan dikirim ke Preview!");
        }

        function refreshPreview() {
            const channel = new BroadcastChannel('website-preview');
            channel.postMessage("REFRESH");
        }

        // Auto save
        setInterval(saveCodes, 3000);

        window.onload = loadCodes;
        window.addEventListener('beforeunload', saveCodes);
    </script>
</body>
</html>
